name: tbit-cloud-ops
services:
  ops:
    build:
      context: ..
      dockerfile: ops-platform/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:8780:8780"]
    volumes: ["ops_data:/data"]
    tmpfs: ["/tmp:mode=1777,size=256m"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [default, ops_edge]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  ops_data:
networks:
  ops_edge:
    name: tbit_ops_edge
