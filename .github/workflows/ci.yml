name: LMS validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lms_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms_test -d lms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://lms_test:ci_test_only@127.0.0.1:5432/lms_test
      LMS_INTEGRATION_TEST: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run test:lab-integration
      - run: npm run test:account-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-integration-results
          path: test-results/
          if-no-files-found: ignore
  video_timing_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/video/requirements-qa.txt
      - run: python -m unittest discover -s scripts/video -p test_timing.py

  operator_lab_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s infra/aws-lab -p 'test_*.py' -v
