name: Attendance evidence validation
on:
  pull_request:
    paths: ['ops-platform/attendance/**', 'ops-platform/compose.attendance.yaml', '.github/workflows/attendance.yml']
  push:
    branches: [main]
    paths: ['ops-platform/attendance/**', 'ops-platform/compose.attendance.yaml', '.github/workflows/attendance.yml']
jobs:
  attendance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: attendance_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi==0.141.1 httpx==0.28.1 'psycopg[binary]>=3.2,<4'
      - run: python -m unittest discover -s ops-platform/attendance -p 'test_*.py' -v
        env:
          ATTENDANCE_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/attendance_test
